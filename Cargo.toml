[package]
name = "tt-sfx"
version = "0.1.0"
edition = "2024"

# Publishing Metadata (Required or recommended by crates.io)
description = "A networked sound effect player and sync engine tailored for Tabletop RPG sessions."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/tt-sfx"
readme = "README.md"
keywords = ["ttrpg", "audio", "soundboard", "networking", "websockets"]
categories = ["multimedia::audio", "game-development"]

[lib]
name = "tt_sfx"
path = "src/lib.rs"

[[bin]]
name = "tt-sfx"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
bincode = "1.3"
blake3 = "1.8.5"
eframe = "0.35.0"
egui = "0.35.0"
env_logger = "0.11.11"
futures-util = { version = "0.3.33", features = ["sink"] }
log = "0.4.33"
midi-control = "0.2.3"
midir = "0.11.0"
notify = "8.2.0"
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
